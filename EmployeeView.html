  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --accent: #4f46e5;
      --accent-dark: #4338ca;
      --accent-light: #eef2ff;
      --ink: #16141f;
      --muted: #6b7280;
      --border: #e8e8ee;
      --surface: #ffffff;
      --bg: #f3f4f9;
      --danger: #dc2626;
      --danger-light: #fef2f2;
      --warn: #d97706;
      --warn-light: #fffbeb;
      --ok: #059669;
      --ok-light: #ecfdf5;
      --shadow: 0 1px 2px rgba(16,15,30,0.04), 0 8px 24px rgba(16,15,30,0.06);
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --accent: #818cf8;
        --accent-dark: #a5b4fc;
        --accent-light: #1e1b3a;
        --ink: #f0f0f5;
        --muted: #9a97ac;
        --border: #2c2a3d;
        --surface: #1b1930;
        --bg: #121022;
        --danger: #f87171;
        --danger-light: #3a1a1e;
        --warn: #fbbf24;
        --warn-light: #3a2f10;
        --ok: #34d399;
        --ok-light: #10302a;
        --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
      }
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    .container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      padding-bottom: 40px;
    }
    .screen { display: none; }
    .screen.active { display: block; animation: fadeIn 0.25s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .login-wrap { padding: 0 18px; }
    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 64px 0 32px;
    }
    .brand-mark {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(79,70,229,0.35);
      margin-bottom: 14px;
    }
    .brand-mark svg { width: 28px; height: 28px; color: #fff; }
    .brand h1 { font-size: 20px; margin: 0; font-weight: 800; letter-spacing: -0.2px; }
    .brand p { font-size: 13px; color: var(--muted); margin: 4px 0 0; font-weight: 600; }

    .login-card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      padding: 26px 22px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    .login-card label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    input[type="password"], input[type="number"], input[type="text"], select {
      width: 100%;
      padding: 13px 14px;
      font-size: 16px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      margin-bottom: 12px;
      background: var(--bg);
      color: var(--ink);
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus, select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-light);
      background: var(--surface);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border: none;
      border-radius: var(--radius-sm);
      padding: 13px 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      color: #fff;
      width: 100%;
      transition: transform 0.08s, opacity 0.15s, box-shadow 0.15s;
    }
    .btn svg { width: 16px; height: 16px; flex-shrink: 0; }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.5; cursor: default; transform: none; }
    .btn-primary { background: var(--accent); box-shadow: 0 4px 14px rgba(79,70,229,0.3); }
    .btn-primary:hover { background: var(--accent-dark); }
    .error-text { color: var(--danger); font-size: 13px; margin: 0 0 12px; min-height: 16px; font-weight: 600; }

    .top-bar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 18px;
      background: rgba(243,244,249,0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    @media (prefers-color-scheme: dark) {
      .top-bar { background: rgba(18,16,34,0.85); }
    }
    .who { display: flex; align-items: center; gap: 10px; }
    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
      flex-shrink: 0;
    }
    .who-text h2 { font-size: 15px; margin: 0; font-weight: 800; line-height: 1.2; }
    .who-text span { font-size: 12px; color: var(--muted); font-weight: 600; }
    .icon-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    .icon-btn svg { width: 17px; height: 17px; }
    .icon-btn:hover { background: var(--danger-light); color: var(--danger); }

    .task-list { padding: 16px 18px 0; }

    .card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      animation: slideUp 0.3s ease;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 4px;
    }
    .category-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      color: var(--accent-dark);
      background: var(--accent-light);
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .task-name { font-size: 17px; font-weight: 800; line-height: 1.3; letter-spacing: -0.1px; }
    .status-badge {
      font-size: 11px;
      font-weight: 800;
      padding: 5px 11px;
      border-radius: 999px;
      white-space: nowrap;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .status-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .status-pending { background: #eef0f4; color: #475467; }
    .status-inprogress { background: #dbeafe; color: #1e40af; }
    .status-onbreak { background: #fef3c7; color: #92400e; }
    @media (prefers-color-scheme: dark) {
      .status-pending { background: #26293a; color: #b6bccb; }
      .status-inprogress { background: #1e2c52; color: #93b4fb; }
      .status-onbreak { background: #3a2f10; color: #fbbf24; }
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      color: var(--muted);
      font-weight: 700;
      margin: 10px 0 14px;
    }
    .meta-row b { color: var(--ink); font-weight: 800; }

    .timer-box {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      margin-bottom: 14px;
      font-variant-numeric: tabular-nums;
    }
    .timer-box.working { background: var(--ok-light); color: var(--ok); }
    .timer-box.onbreak { background: var(--warn-light); color: var(--warn); }
    .timer-box svg { width: 16px; height: 16px; flex-shrink: 0; }
    .timer-clock { font-size: 20px; font-weight: 800; letter-spacing: 0.5px; }
    .timer-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; opacity: 0.85; margin-left: auto; }

    .card-actions { display: flex; gap: 8px; }
    .card-actions .btn { width: auto; flex: 1; padding: 11px; font-size: 14px; }
    .btn-start { background: var(--accent); }
    .btn-break { background: var(--warn); }
    .btn-resume { background: var(--ok); }
    .btn-stop { background: var(--danger); }

    .empty {
      text-align: center;
      color: var(--muted);
      margin-top: 30px;
      padding: 32px 20px;
      font-size: 14px;
      font-weight: 600;
      background: var(--surface);
      border-radius: var(--radius-lg);
      border: 1px dashed var(--border);
    }
    .empty svg { width: 34px; height: 34px; margin-bottom: 10px; color: var(--muted); opacity: 0.6; }

    .skeleton {
      background: var(--surface);
      border-radius: var(--radius-lg);
      padding: 18px;
      margin-bottom: 14px;
      border: 1px solid var(--border);
    }
    .skel-line {
      height: 12px;
      border-radius: 6px;
      background: linear-gradient(90deg, var(--border) 25%, var(--accent-light) 50%, var(--border) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      margin-bottom: 10px;
    }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(10,9,20,0.55);
      align-items: flex-end;
      justify-content: center;
      z-index: 20;
    }
    .modal-overlay.active { display: flex; animation: fadeIn 0.15s ease; }
    .modal {
      background: var(--surface);
      width: 100%;
      max-width: 480px;
      border-radius: 22px 22px 0 0;
      padding: 10px 20px calc(20px + env(safe-area-inset-bottom));
      animation: slideUp 0.2s ease;
    }
    .modal-handle { width: 40px; height: 4px; border-radius: 999px; background: var(--border); margin: 0 auto 16px; }
    .modal h3 { margin: 0 0 4px; font-size: 18px; font-weight: 800; }
    .modal .modal-sub { font-size: 13px; color: var(--muted); font-weight: 600; margin: 0 0 18px; }
    .modal label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 7px; }
    .qty-stepper { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .qty-stepper input { margin-bottom: 0; text-align: center; font-weight: 800; font-size: 18px; }
    .stepper-btn {
      width: 46px;
      height: 46px;
      flex-shrink: 0;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--border);
      background: var(--bg);
      color: var(--ink);
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
    }
    .stepper-btn:active { transform: scale(0.94); }
    .modal-actions { display: flex; gap: 10px; margin-top: 8px; }
    .modal-actions .btn { flex: 1; }
    .btn-secondary { background: var(--bg); color: var(--ink); border: 1.5px solid var(--border); }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%) translateY(20px);
      background: var(--ink);
      color: var(--bg);
      padding: 12px 20px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 30;
      max-width: 90%;
      text-align: center;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.toast-error { background: var(--danger); color: #fff; }
    .toast.toast-ok { background: var(--ok); color: #fff; }
    .signature {
      position: fixed;
      right: 14px;
      bottom: 6px;
      font-family: 'Brush Script MT', 'Segoe Script', cursive;
      font-size: 13px;
      font-style: italic;
      color: var(--ink);
      opacity: 0.08;
      letter-spacing: 0.5px;
      pointer-events: none;
      user-select: none;
      z-index: 1;
      animation: sigBreathe 6s ease-in-out infinite;
      white-space: nowrap;
    }
    @keyframes sigBreathe {
      0%, 100% { opacity: 0.05; }
      50% { opacity: 0.16; }
    }
    @media (prefers-reduced-motion: reduce) {
      .signature { animation: none; opacity: 0.1; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="loginScreen" class="screen active">
      <div class="login-wrap">
        <div class="brand">
          <div class="brand-mark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/></svg>
          </div>
          <h1>Work Tracker</h1>
          <p>Sign in with your PIN</p>
        </div>
        <div class="login-card">
          <form id="loginForm">
            <label for="pinInput">PIN</label>
            <input type="password" id="pinInput" inputmode="numeric" autocomplete="off" required>
            <p class="error-text" id="loginError"></p>
            <button type="submit" class="btn btn-primary" id="loginBtn">Login</button>
          </form>
        </div>
      </div>
    </div>

    <div id="taskScreen" class="screen">
      <div class="top-bar">
        <div class="who">
          <div class="avatar" id="avatarInitial"></div>
          <div class="who-text">
            <h2 id="greetingName"></h2>
            <span>Today's tasks</span>
          </div>
        </div>
        <button class="icon-btn" id="logoutBtn" title="Logout">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
      <div class="task-list" id="taskList"></div>
    </div>
  </div>

  <div class="modal-overlay" id="stopModal">
    <div class="modal">
      <div class="modal-handle"></div>
      <h3>Stop Work</h3>
      <p class="modal-sub" id="stopModalSub"></p>
      <input type="hidden" id="stopTaskId">
      <label for="stopQty">Qty Completed</label>
      <div class="qty-stepper">
        <button type="button" class="stepper-btn" id="qtyMinusBtn">&minus;</button>
        <input type="number" id="stopQty" min="0" required>
        <button type="button" class="stepper-btn" id="qtyPlusBtn">&plus;</button>
      </div>
      <label for="stopNote">Note (optional)</label>
      <input type="text" id="stopNote">
      <div class="modal-actions">
        <button class="btn btn-secondary" id="stopCancelBtn">Cancel</button>
        <button class="btn btn-stop" id="stopSubmitBtn">Submit</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    var ICONS = {
      play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
      pause: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>',
      stop: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h12v12H6z"/></svg>',
      clock: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm.75 5v5.4l4.2 2.5-.75 1.25-4.95-3V7h1.5z"/></svg>',
      pauseSmall: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h3v14H7zM14 5h3v14h-3z"/></svg>',
      inbox: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11L2 12v6a2 2 0 002 2h16a2 2 0 002-2v-6l-3.45-6.89A2 2 0 0016.76 4H7.24a2 2 0 00-1.79 1.11z"/></svg>'
    };

    var API_URL = 'https://script.google.com/macros/s/AKfycbwrpn4HXBVDrKho5uT1OMCbsBonMAOuOZVVL_9nVLbAcy1uN0W8TNjXECeXO2YZH7W7/exec';

    function callApi(action, params) {
      var url = API_URL + '?action=' + encodeURIComponent(action);
      Object.keys(params || {}).forEach(function (key) {
        var value = params[key];
        if (typeof value === 'object' && value !== null) value = JSON.stringify(value);
        url += '&' + encodeURIComponent(key) + '=' + encodeURIComponent(value);
      });
      return fetch(url, { cache: 'no-store' })
        .then(function (res) {
          if (!res.ok) throw new Error('Network error (' + res.status + ')');
          return res.json();
        })
        .then(function (payload) {
          if (!payload.ok) throw new Error((payload.data && payload.data.message) || 'Request failed');
          return payload.data;
        });
    }

    var currentEmp = null;
    var pollTimer = null;
    var tickTimer = null;
    var timers = loadTimers();
    var tasksById = {};

    function loadTimers() {
      try { return JSON.parse(localStorage.getItem('ewt_timers') || '{}'); } catch (e) { return {}; }
    }
    function saveTimers() {
      localStorage.setItem('ewt_timers', JSON.stringify(timers));
    }
    function ensureTimerState(taskId, status) {
      var t = timers[taskId];
      if (status === 'InProgress') {
        if (!t) {
          timers[taskId] = { runningSince: Date.now(), accumulatedMs: 0 };
        } else if (t.runningSince === null) {
          t.runningSince = Date.now();
        }
      } else if (status === 'OnBreak') {
        if (!t) {
          timers[taskId] = { runningSince: null, accumulatedMs: 0 };
        } else if (t.runningSince !== null) {
          t.accumulatedMs += Date.now() - t.runningSince;
          t.runningSince = null;
        }
      } else if (timers[taskId]) {
        delete timers[taskId];
      }
    }
    function pruneTimers(activeTaskIds) {
      Object.keys(timers).forEach(function (id) {
        if (activeTaskIds.indexOf(id) === -1) delete timers[id];
      });
    }
    function getElapsedMs(taskId) {
      var t = timers[taskId];
      if (!t) return 0;
      var extra = t.runningSince !== null ? (Date.now() - t.runningSince) : 0;
      return t.accumulatedMs + extra;
    }
    function formatElapsed(ms) {
      var totalSec = Math.max(0, Math.floor(ms / 1000));
      var h = Math.floor(totalSec / 3600);
      var m = Math.floor((totalSec % 3600) / 60);
      var s = totalSec % 60;
      var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
      return (h > 0 ? h + ':' + pad(m) : m) + ':' + pad(s);
    }

    function esc(s) {
      return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    var toastTimer = null;
    function showToast(msg, type) {
      var el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'toast show' + (type === 'error' ? ' toast-error' : type === 'ok' ? ' toast-ok' : '');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { el.className = 'toast'; }, 3000);
    }

    function setLoginError(msg) {
      document.getElementById('loginError').textContent = msg || '';
    }
    function setLoginBusy(busy) {
      document.getElementById('loginBtn').disabled = busy;
      document.getElementById('loginBtn').textContent = busy ? 'Checking...' : 'Login';
    }
    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(function (s) { s.classList.remove('active'); });
      document.getElementById(id).classList.add('active');
    }

    function showTasks() {
      document.getElementById('greetingName').textContent = 'Hi, ' + currentEmp.name;
      document.getElementById('avatarInitial').textContent = (currentEmp.name || '?').trim().charAt(0).toUpperCase();
      showScreen('taskScreen');
      document.getElementById('taskList').innerHTML = renderSkeleton();
      loadTasks();
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(loadTasks, 30000);
      if (tickTimer) clearInterval(tickTimer);
      tickTimer = setInterval(tickClocks, 1000);
    }

    function renderSkeleton() {
      var one = '<div class="skeleton"><div class="skel-line" style="width:40%"></div><div class="skel-line" style="width:70%"></div><div class="skel-line" style="width:50%"></div></div>';
      return one + one;
    }

    var loadTasksSeq = 0;
    function loadTasks() {
      var seq = ++loadTasksSeq;
      callApi('getMyTasks', { empId: currentEmp.empId })
        .then(function (tasks) {
          if (seq !== loadTasksSeq) return;
          renderTasks(tasks);
        })
        .catch(function (err) {
          if (seq !== loadTasksSeq) return;
          console.error(err);
          showToast('Could not refresh tasks.', 'error');
        });
    }

    function tickClocks() {
      document.querySelectorAll('.timer-clock[data-task-id]').forEach(function (el) {
        var taskId = el.getAttribute('data-task-id');
        el.textContent = formatElapsed(getElapsedMs(taskId));
      });
    }

    function renderTasks(tasks) {
      var list = document.getElementById('taskList');
      if (!tasks || tasks.length === 0) {
        pruneTimers([]);
        saveTimers();
        list.innerHTML = '<div class="empty">' + ICONS.inbox + '<div>No active tasks assigned.</div></div>';
        return;
      }

      tasks.forEach(function (t) { ensureTimerState(t.taskId, t.status); });
      pruneTimers(tasks.map(function (t) { return t.taskId; }));
      saveTimers();

      tasksById = {};
      tasks.forEach(function (t) { tasksById[t.taskId] = t; });

      list.innerHTML = tasks.map(function (t) {
        var statusClass = 'status-' + String(t.status).toLowerCase();
        var buttons = '';
        var timerHtml = '';

        if (t.status === 'Pending') {
          buttons = '<button class="btn btn-start" onclick="startWorkAction(\'' + t.taskId + '\', this)">' + ICONS.play + '<span>Start Work</span></button>';
        } else if (t.status === 'InProgress') {
          buttons =
            '<button class="btn btn-break" onclick="takeBreakAction(\'' + t.taskId + '\', this)">' + ICONS.pause + '<span>Take Break</span></button>' +
            '<button class="btn btn-stop" onclick="openStopModal(\'' + t.taskId + '\')">' + ICONS.stop + '<span>Stop</span></button>';
          timerHtml = '<div class="timer-box working">' + ICONS.clock +
            '<span class="timer-clock" data-task-id="' + t.taskId + '">' + formatElapsed(getElapsedMs(t.taskId)) + '</span>' +
            '<span class="timer-label">Working</span></div>';
        } else if (t.status === 'OnBreak') {
          buttons = '<button class="btn btn-resume" onclick="resumeWorkAction(\'' + t.taskId + '\', this)">' + ICONS.play + '<span>Resume Work</span></button>';
          timerHtml = '<div class="timer-box onbreak">' + ICONS.pauseSmall +
            '<span class="timer-clock" data-task-id="' + t.taskId + '">' + formatElapsed(getElapsedMs(t.taskId)) + '</span>' +
            '<span class="timer-label">On Break</span></div>';
        }

        return '<div class="card">' +
          '<div class="card-header">' +
            '<div>' +
              '<span class="category-tag">' + esc(t.category) + '</span><br>' +
              '<span class="task-name">' + esc(t.taskName) + '</span>' +
            '</div>' +
            '<span class="status-badge ' + statusClass + '"><span class="dot"></span>' + esc(t.status) + '</span>' +
          '</div>' +
          '<div class="meta-row"><span>Target Qty</span><b>' + esc(t.targetQty) + '</b></div>' +
          timerHtml +
          '<div class="card-actions">' + buttons + '</div>' +
        '</div>';
      }).join('');
    }

    function startWorkAction(taskId, btn) {
      btn.disabled = true;
      callApi('startWork', { taskId: taskId, empId: currentEmp.empId })
        .then(function () { loadTasks(); })
        .catch(function (err) { btn.disabled = false; showToast(err.message, 'error'); });
    }
    function takeBreakAction(taskId, btn) {
      btn.disabled = true;
      callApi('takeBreak', { taskId: taskId, empId: currentEmp.empId })
        .then(function () { loadTasks(); })
        .catch(function (err) { btn.disabled = false; showToast(err.message, 'error'); });
    }
    function resumeWorkAction(taskId, btn) {
      btn.disabled = true;
      callApi('resumeWork', { taskId: taskId, empId: currentEmp.empId })
        .then(function () { loadTasks(); })
        .catch(function (err) { btn.disabled = false; showToast(err.message, 'error'); });
    }

    function openStopModal(taskId) {
      var t = tasksById[taskId];
      document.getElementById('stopTaskId').value = taskId;
      document.getElementById('stopModalSub').textContent = t ? t.taskName : '';
      document.getElementById('stopQty').value = '';
      document.getElementById('stopNote').value = '';
      document.getElementById('stopSubmitBtn').disabled = false;
      document.getElementById('stopModal').classList.add('active');
    }
    function closeStopModal() {
      document.getElementById('stopModal').classList.remove('active');
    }
    document.getElementById('stopCancelBtn').addEventListener('click', closeStopModal);

    document.getElementById('qtyMinusBtn').addEventListener('click', function () {
      var input = document.getElementById('stopQty');
      var v = Math.max(0, (Number(input.value) || 0) - 1);
      input.value = v;
    });
    document.getElementById('qtyPlusBtn').addEventListener('click', function () {
      var input = document.getElementById('stopQty');
      var v = (Number(input.value) || 0) + 1;
      input.value = v;
    });

    document.getElementById('stopSubmitBtn').addEventListener('click', function () {
      var taskId = document.getElementById('stopTaskId').value;
      var qty = document.getElementById('stopQty').value;
      var note = document.getElementById('stopNote').value;
      if (qty === '' || isNaN(Number(qty)) || Number(qty) < 0) {
        showToast('Please enter a valid quantity.', 'error');
        return;
      }
      var btn = document.getElementById('stopSubmitBtn');
      btn.disabled = true;
      callApi('stopWork', { taskId: taskId, empId: currentEmp.empId, qtyDone: Number(qty), note: note })
        .then(function (res) {
          closeStopModal();
          showToast(res && res.status === 'Completed' ? 'Task completed. Nice work!' : 'Progress saved.', 'ok');
          loadTasks();
        })
        .catch(function (err) {
          btn.disabled = false;
          showToast(err.message, 'error');
        });
    });

    document.getElementById('loginForm').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var pin = document.getElementById('pinInput').value.trim();
      if (!pin) return;
      setLoginError('');
      setLoginBusy(true);
      callApi('authenticateEmployee', { pin: pin })
        .then(function (res) {
          setLoginBusy(false);
          if (!res) {
            setLoginError('Invalid PIN. Please try again.');
            return;
          }
          currentEmp = res;
          sessionStorage.setItem('ewt_emp', JSON.stringify(res));
          showTasks();
        })
        .catch(function (err) {
          setLoginBusy(false);
          setLoginError('Login failed: ' + err.message);
        });
    });

    document.getElementById('logoutBtn').addEventListener('click', function () {
      currentEmp = null;
      sessionStorage.removeItem('ewt_emp');
      if (pollTimer) clearInterval(pollTimer);
      if (tickTimer) clearInterval(tickTimer);
      document.getElementById('pinInput').value = '';
      showScreen('loginScreen');
    });

    (function init() {
      var saved = sessionStorage.getItem('ewt_emp');
      if (saved) {
        try {
          currentEmp = JSON.parse(saved);
          showTasks();
        } catch (e) {
          sessionStorage.removeItem('ewt_emp');
        }
      }
    })();
  </script>
  <div class="signature">T.G Rajiv Agrawal</div>
</body>
</html>
